# Build a signed nightly APK on every push to master and publish an F-Droid repo.
#
# The repo is published to the 'pages' branch of this repository. Codeberg Pages
# serves it at: https://arc345.codeberg.page/Gadgetbridge/repo
#
# Repository secrets (Settings > Actions > Secrets):
#   SIGNING_KEY   base64 of the PKCS12 keystore
#   KEYSTOREPASS  keystore password. Avoid double quotes in it.
#   KEYPASS       key password (same as KEYSTOREPASS for PKCS12)
#   PAGES_TOKEN   Codeberg access token with write access to this repository
#
# Create the keystore once, on your own machine (alias must be 'gadgetbridge'):
#   keytool -genkeypair -v -keystore keystore.p12 -storetype PKCS12 \
#     -alias gadgetbridge -keyalg RSA -keysize 4096 -validity 10000
#   base64 -w0 keystore.p12   # paste the output as SIGNING_KEY

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  fdroid:
    # Run only on this fork, and only for master. Other branches must not
    # publish to the F-Droid repo, even when started by hand.
    if: github.repository == 'ARC345/Gadgetbridge' && github.ref == 'refs/heads/master'
    runs-on: codeberg-medium
    container:
      image: codeberg.org/freeyourgadget/android-fdroid-tools:37.0.0-0
    env:
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      KEYSTOREPASS: ${{ secrets.KEYSTOREPASS }}
      KEYPASS: ${{ secrets.KEYPASS }}
      PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
      GRADLE_OPTS: "-Dorg.gradle.vfs.watch=true"

    steps:
      # The image has no node, so actions/checkout cannot run.
      # Use a full clone. The nightly versionCode is the commit count, which needs full history.
      - name: Clone repository
        run: |
          set -eu
          git config --global --add safe.directory '*'
          git clone -q --branch "${{ github.ref_name }}" "https://codeberg.org/${{ github.repository }}.git" .
          git checkout -q "${{ github.sha }}"

      - name: Build signed nightly APK
        run: |
          set -eu
          # The Gradle signing config reads 'keystore.p12' relative to the app module, so store it in app/.
          echo "$SIGNING_KEY" | base64 -d > app/keystore.p12
          # Nightly builds set versionCode from the commit count (app/build.gradle).
          ./gradlew assembleMainlineNightly \
            -Dnightly_store_file="keystore.p12" \
            -Dnightly_store_password="$KEYPASS" \
            -Dnightly_key_alias="gadgetbridge" \
            -Dnightly_key_password="$KEYPASS"

      - name: Build F-Droid repo index
        run: |
          set -eu
          mkdir -p repo
          find app/build/outputs/apk/mainline/nightly -name '*.apk' -exec cp {} repo/ \;
          ls -la repo

          # config.yml for fdroidserver. The keystore is the one written in the build step.
          cat > config.yml <<EOF
          repo_url: "https://arc345.codeberg.page/Gadgetbridge/repo"
          repo_name: "Gadgetbridge (ARC345 nightly)"
          repo_description: "Nightly builds of the ARC345 Gadgetbridge fork."
          repo_keyalias: "gadgetbridge"
          keystore: "app/keystore.p12"
          keystorepass: "$KEYSTOREPASS"
          keypass: "$KEYPASS"
          EOF

          fdroid update -c
          fdroid update
          ls -laR repo

      - name: Publish repo to pages branch
        run: |
          set -eu
          PAGES_DIR="$(mktemp -d)"
          cp -r repo "$PAGES_DIR/repo"
          cd "$PAGES_DIR"
          git init -q -b pages
          git config user.name "CI"
          git config user.email "ci@users.noreply.codeberg.org"
          git add -A
          git commit -q -m "F-Droid repo for ${{ github.sha }}"
          # Force push. The pages branch keeps only the latest repo, so the history stays small.
          git push -q -f "https://oauth2:${PAGES_TOKEN}@codeberg.org/${{ github.repository }}.git" pages
